; =============================================================================
;  vrad3_gpu.ini - optional settings for the GPU vrad3.exe
; =============================================================================
;
;  To use this file, copy it next to vrad3.exe (Half-Life Alyx\game\bin\win64)
;  and rename it to vrad3_gpu.ini.
;
;  One "name = value" per line. Anything after ; or # is a comment.
;  A misspelled name or a value that isn't allowed is skipped with a warning
;  at the end of Hammer's compile output. It won't stop a compile.
;  The file is read again for every compile, so Hammer doesn't need
;  a restart.
;
;  To return a setting to its default value you can simply delete its line.
;
;  BASIC settings come first. The ADVANCED ones further down are for
;  comparisons, testing and troubleshooting.

[vrad3_gpu]

; #############################################################################
;  BASIC SETTINGS
; #############################################################################

; --- enabled -----------------------------------------------------------------
; Turns GPU compilation on or off.
;   true   Default. The GPU does every step it can.
;   false  HLA's original compiler runs instead.
;          Use it to compare results or when something goes wrong.
enabled = true

; --- estimator ---------------------------------------------------------------
; Picks which baking style the compiler uses.
;   cs2  Default. Counter-Strike 2's GPU baker. It takes more samples, so
;        there's less noise, and it has its own ambient occlusion, firefly
;        removal and brightness cap.
;   hla  Half-Life: Alyx's baker. This is the closest to a bake with HLA's compiler.
estimator = cs2

; --- emissive ----------------------------------------------------------------
; Self-illuminated materials (vr_complex with Self Illum on) light the area
; around them.
;   off       Default. Emissive is not baked, which is what HLA does normally.
;   on        Glowing surfaces light the scene as brightly as they look in
;             game. Self Illum brightness, scale, tint and mask all count.
;   <number>  Same as on, times this number. 0.5 gives half the light.
; Single materials can change this in the .vmat, under Attributes:
;   emissiveLightingEnabled  0 means this material doesn't light the scene.
;   emissiveLightingBoost    multiplies this material's light (default 1).
; Only the GPU can bake the glow: see Emissive Fallback (emissive_fallback).
emissive = off

; --- gpu_usage ---------------------------------------------------------------
; Keeps the PC usable while the GPU bakes.
;   auto   Default. Runs the GPU in short bursts at lower priority to keep
;          the desktop running smoothly. Compiles may take around 10% longer.
;   50-99  Limits GPU usage to the specified percentage. Lower values keep
;          the PC more responsive but increase compile times.
;   max    Removes the limit for maximum performance. The desktop may
;          become less responsive while the GPU is working.
gpu_usage = auto

; --- parallel_compiling ------------------------------------------------------
; Compiles multiple lightmap blocks and probe volumes at the same time
; to reduce overall compile time.
;   auto  Default. Runs as many tasks at once as system resources allow.
;   off   One at a time.
;   <N>   At most N at once. RAM can still lower this.
parallel_compiling = auto

; --- memory_reserve ----------------------------------------------------------
; Amount of RAM that background bakes leave free for Windows and other programs.
;   auto  Default. 4 GB or 15% of RAM, whichever is more.
;   <GB>  Keep this many GB free, for example 2. A lower number lets more
;         blocks run at once on a PC with little RAM.
;   off   No RAM checks. Blocks can run out of memory and fail.
memory_reserve = auto

; --- gpu ---------------------------------------------------------------------
; Which graphics card to use. It needs hardware ray tracing (DirectX
; Raytracing 1.1): NVIDIA RTX 20 series, AMD RX 6000, Intel Arc or newer.
;   auto      Default. The fastest card found.
;   <text>    The card whose name contains this text, for example RTX or
;             Radeon.
;   <number>  The card at this position in Windows' list, fastest first
;             (0 is the first). Task Manager can number cards differently, so
;             a name is safer.
; The end of the compile output will name the card that was used.
gpu = auto

; --- progress_window ---------------------------------------------------------
; A console window for each lightmap block and light probe volume, with its
; progress. The windows do not take focus and close when their step ends.
;   off      Default. No windows.
;   on       Minimized on the taskbar.
;   visible  Open on screen.
progress_window = off

; --- logging, log_folder -----------------------------------------------------
; Log files for bug reports.
;   off       Default.
;   summary   Saves worker info, timings and crashes to vrad3-gpu.log.
;   detailed  Includes full worker logs, launch diagnostics and crash
;             dumps. Use this when reporting a bug.
; Log Folder: Leave blank to use %LOCALAPPDATA%\vrad3-gpu\logs.
; Detailed logs keep the newest 5 compiles, for up to 14 days.
logging = off
log_folder =


; #############################################################################
;  ADVANCED SETTINGS
;  These settings are for comparing against HLA's or CS2's results,
;  for testing and for working around a problem.
; #############################################################################

; =============================================================================
;  CS2 mode only (Estimator Mode = cs2)
; =============================================================================

; --- cs2_samples -------------------------------------------------------------
; How many samples each luxel gets.
;   on   Default. CS2's counts: 512 to 4096 per luxel at final quality, where
;        HLA uses 256 to 1024. A luxel stops early once its light has
;        settled. Less noise, but path tracing takes up to 4 times as long.
;   off  HLA's counts.
cs2_samples = on

; --- cs2_fireflies -----------------------------------------------------------
; Fireflies are single luxels that come out far too bright.
;   on   Default. CS2's firefly removal: a luxel more than 4 times as bright
;        as its neighbors gets their average.
;   off  HLA's firefly pass. It only fixes the directional part.
cs2_fireflies = on

; --- clamp_method ------------------------------------------------------------
; How very bright light samples are capped.
;   cs2  Default. The whole sample is scaled down, so it keeps its color.
;        This cuts more than HLA does, so hot spots and strong glow come out darker.
;   hla  Each color channel is capped on its own.
clamp_method = cs2

; --- ao_method ---------------------------------------------------------------
; How ambient occlusion is baked.
;   cs2  Default. Each direction counts as open or blocked within 16 units.
;        The map's light_environment occlusion settings are ignored.
;   hla  A smooth falloff up to the map's max_occlusion_distance.
ao_method = cs2

; --- backface_shadows --------------------------------------------------------
; Shadows from one-sided faces, such as a plane with nothing on its back.
;   cs2  Default. The face blocks light from both sides.
;   hla  Light that reaches the face from behind passes through it.
backface_shadows = cs2

; --- emissive_mask -----------------------------------------------------------
; How the glow follows the Self Illum Mask. Only used when Emissive Lighting
; (emissive) is on.
;   texel    Default. Texel by texel, as in CS2.
;   average  One average color for the whole surface, as in HLA mode.
;            Materials with scaled or offset texture coordinates always get
;            this.
emissive_mask = texel

; =============================================================================
;  HLA mode only (Estimator Mode = hla)
; =============================================================================

; --- light_paths -------------------------------------------------------------
; HLA's baker also traces rays from the lights and joins them to the camera
; paths. The result is closer to HLA's CPU bake, and each block takes about
; twice as long.
;   auto  Default. On for final-quality compiles, off for previews.
;   on    Always.
;   off   Never. Faster.
light_paths = auto

; =============================================================================
;  Both modes
; =============================================================================

; --- sample_grid -------------------------------------------------------------
; Sets the maximum number of sample points per luxel (N x N). Fewer points
; are faster but can soften small shadow details. The compiler may request
; fewer points: 5 at final quality, 3 at medium and 1 at preview.
;   auto        Default. Uses 1 in CS2 mode, or what the compiler asks for in HLA mode.
;   5, 3, 2, 1  At most N x N. More points need much more RAM: an 8K block
;               takes about 30 GB with 5, and 9 GB with auto.
sample_grid = auto

; --- emissive_fallback -------------------------------------------------------
; What happens to emissive glow when a block can't use the GPU. Only used when
; Emissive Lighting (emissive) is on.
;   cpu   Default. HLA's CPU baker does the block without the glow.
;   stop  The compile fails, so no lightmap ships with part of the glow
;         missing. GPU Baking = false, -gpu-cpu and Verify still use the CPU
;         on purpose.
emissive_fallback = cpu

; --- direct_light ------------------------------------------------------------
; Direct lighting, including soft shadows from light sources.
;   auto  Default. Use the GPU for blocks big enough to gain from it.
;   on    Always try the GPU.
;   off   HLA's CPU code.
direct_light = auto

; --- light_probes ------------------------------------------------------------
; Bounced light in light probe volumes. These light dynamic props and characters.
;   auto  Default. Use the GPU for volumes big enough to gain from it.
;   on    Try the GPU for every volume.
;   off   HLA's CPU code.
light_probes = auto

; =============================================================================
;  Hammer preview (vrad2.exe, optional)
; =============================================================================
; These need our optional vrad2.exe.

; --- hammer_preview ----------------------------------------------------------
; Who bakes Hammer's Bake Lighting preview.
;   vrad3  Default. vrad3 bakes it the way a full compile does: the vertex
;          lighting, and the light probe volumes (see Preview Probe Volumes).
;          HLA's vrad2 does everything else, and the whole preview if
;          anything fails.
;   vrad2  HLA's vrad2 does the whole preview, as it does without our
;          vrad2.exe override.
hammer_preview = vrad3

; --- preview_probe_volumes ---------------------------------------------------
; Who bakes the preview's light probe volumes when Hammer Preview is vrad3.
;   vrad3  Default. vrad3, the same way a full compile does: the same solid
;          voxels, flood fill, ambient occlusion and filters.
;   vrad2  HLA's vrad2, as without our vrad2.exe override.
preview_probe_volumes = vrad3

; --- preview_gpu -------------------------------------------------------------
; Where vrad3 lights the preview's triangles and probe volumes when Hammer
; Preview is vrad3.
;   auto  Default. The GPU, when the job is bigger than what the CPU does in
;         about a second (about the GPU's start-up time). Smaller jobs stay
;         on the CPU.
;   on    Always the GPU. HLA's CPU code takes over if the GPU can't.
;   off   HLA's CPU code.
preview_gpu = auto

; --- preview_quality, preview_min_samples, preview_max_samples, preview_error
; How many samples the preview takes. Preview Quality uses a full compile's
; settings at that quality (the compiler's -lightmapVRadQuality):
;   1  Default. Triangles get 128-256 samples, with error 0.05.
;      In CS2 mode with CS2 Sample Counts on: 256-1024.
;      Probe volumes get 128-512 per cell, with error 0.01.
;   2  Triangles get 256-1024, with error 0.025.
;      In CS2 mode with CS2 Sample Counts on: 512-4096.
;      Probe volumes get 256-1024, with error 0.01.

; The following settings override Preview Quality for triangles.
;   Preview Min Samples  Minimum samples per triangle (1-4096).
;   Preview Max Samples  Maximum samples per triangle (1-4096).
;   Preview Error        Stops sampling when noise falls below this value
;                        (0-1). Set to 0 to always use the maximum samples.
; Set to auto to use the values from Preview Quality.
; CS2 Hammer uses 64, 128 and 0.1. Fewer samples make previews faster
; but noisier.
preview_quality = 1
preview_min_samples = auto
preview_max_samples = auto
preview_error = auto

; --- preview_subdivide -------------------------------------------------------
; Splits large faces into smaller triangles during GPU previews to improve
; lighting and reduce noise, especially on large walls and ceilings.
;   auto      Default. 64 units, or higher if needed to limit preview size.
;   off       Disables splitting. Small jobs stay on the CPU.
;   8..4096   Splits triangles with an edge longer than this many units.
preview_subdivide = auto

; --- preview_corners ---------------------------------------------------------
; Controls how the GPU preview calculates the three corner values of each
; triangle from its 16 lit points.
;   auto   Default. Uses cs2 in CS2 mode and valve in HLA mode.
;   cs2    Uses CS2 Hammer's method. Ignores points over 8 times the average
;          brightness to reduce bright spots from individual samples.
;   valve  Uses HLA's method, weighting points based on their distance
;          from each corner.
preview_corners = auto

; --- preview_capture, preview_capture_folder ---------------------------------
; Saves each preview job for debugging. Includes Hammer's files before
; and after the bake, along with a report. Captures can be as large as
; the map itself, so turn this off when finished.
;   Preview Capture         off (default) or on.
;   Preview Capture Folder  Blank uses %LOCALAPPDATA%\vrad3-gpu\captures.
preview_capture = off
preview_capture_folder =

; =============================================================================
;  Reports and tester mode
; =============================================================================

; --- light_limit_report ------------------------------------------------------
; Reports surfaces where more than four baked indexed lights affect them.
; The game can only display four per surface, so the baker drops the
; weakest lights.
; Useful for finding lighting issues caused by this limit.
;   off  Default.
;   on   Saves affected surfaces and light info to light-limits.log.
;        Also enables summary logging and slightly increases compile time.
light_limit_report = off

; --- verify, verify_blocks, verify_probes ------------------------------------
; Tester mode. It checks the GPU against HLA's CPU code on your map. A few
; lightmap blocks and probe volumes are baked both ways and compared, and the
; CPU result is kept. Each checked item costs its full CPU time. This turns
; on summary logging. The combine step prints one line per item, for example
;   VRAD3 GPU verify: block 7 RGB 0.998 SH 1.004 indices 99.8% -> OK
; OK means the average brightness is within 3% of the CPU's, and at least
; 97% of luxels have the same lights. CHECK means: please send the log and
; the map (if possible).
;   Verify         off (default) or on.
;   Verify Blocks  how many lightmap blocks to check (default 1).
;   Verify Probes  how many probe volumes to check (default 1).
verify = off
verify_blocks = 1
verify_probes = 1
